version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    ignore:
      # sha2 0.11.1 and later need Rust 1.88; the CM5 compiles with 1.85
      - dependency-name: "sha2"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
      - dependency-name: "ed25519-dalek"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "getrandom"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "jsonschema"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "sha2"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      cargo_updates:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    groups:
      github_actions_updates:
        patterns:
          - "*"
