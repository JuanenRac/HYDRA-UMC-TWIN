# HYDRA-UMC-TWIN - Simulation bench
# Copyright (C) 2026 JuanenRac (Electro Hobby 3D) <electrohobby3d@gmail.com>
# GPL-3.0-or-later - see LICENSE
#
# The twin against a simulated machine: two simulated robots receive the same seeded orders while faults are injected into the one that stands for the real machine (a joint that sticks, an encoder that jumps, a lost order, a slow actuator, one bad reading) and the drift monitor has to name the joint, never raise an alarm on a healthy machine and never take a joint past its limits.
# It runs on every push and pull request, by hand, and once a week. Nothing here touches hardware.
# =============================================================================
name: Simulation bench

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 2"

permissions:
  contents: read

jobs:
  simulation:
    name: Run the simulation bench
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # 1.85.1
        with:
          toolchain: 1.85.1
      - name: Cache the Cargo registry and the build directory
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Run the simulation bench
        run: cargo test --locked --bin hydra-umc-twin simulation_bench -- --nocapture
