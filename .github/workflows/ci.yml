name: HYDRA-UMC CI baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Validate project baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the baseline steps of the family
        uses: ./.github/actions/hydra-baseline
  rust-msrv:
    name: Build with Rust 1.85.1 (Debian trixie toolchain)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust 1.85.1
        uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # 1.85.1
        with:
          toolchain: 1.85.1
          components: clippy, rustfmt
      - name: Build release with the locked dependency versions
        run: cargo build --release --locked
      - name: Check all targets with the locked dependency versions
        run: cargo check --all-targets --locked
      - name: Format, lints and tests with Rust 1.85.1
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
      - name: The date-and-time crate with the known advisory is not in the dependency tree
        run: |
          cargo tree --locked --all-targets --edges all --prefix none | sort -u
          if cargo tree --locked --all-targets --edges all -i time; then
            echo "the crate time is in the dependency tree" >&2
            exit 1
          fi
          if grep -q 'name = "time"' Cargo.lock; then
            echo "the crate time is in Cargo.lock" >&2
            exit 1
          fi
